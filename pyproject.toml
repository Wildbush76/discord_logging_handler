[project]
name = "discord_logging_handler"
version = "0.1.0"
description = "A logger handle that uses discord"
readme = "README.md"
authors = [
    { name = "Wildbush", email = "75509166+Wildbush76@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "discord-py>=2.7.1",
    "ratelimit>=2.2.1",
]

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"
